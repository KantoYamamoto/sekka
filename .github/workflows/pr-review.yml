name: Sekka PR review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sekka-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Tests and structural review guide
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record toolchain
        run: |
          swift --version
          xcodebuild -version
          python3 --version
      - name: Swift tests
        run: swift test
      - name: CLI and Git checks
        run: python3 Scripts/smoke.py .build/debug/sekka
      - name: Summary renderer checks
        run: python3 -m unittest discover -s Scripts -p 'test_*.py'
      - name: Generate PR review guide
        env:
          SEKKA_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          SEKKA_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          SEKKA_PR: ${{ github.event.pull_request.number }}
        run: python3 Scripts/ci_review.py
      - name: Structural context experiment checks
        run: |
          swift test --package-path Experiments/StructuralContext --scratch-path .build/structural-context
          python3 Experiments/StructuralContext/verify.py --binary .build/structural-context/debug/context-probe --output .build/pr-review/structural-context.json --text-output .build/pr-review/structural-context.text
      - name: Check fixed review material controls
        run: |
          python3 Experiments/StructuralContext/ResultHoldout/verify_diff_controls.py
          python3 Experiments/StructuralContext/BothSideHoldout/verify_diff_controls.py
          python3 Experiments/StructuralContext/DirectRelationsHoldout/selection_controls.py
      - name: State operation prototype controls
        run: |
          swift build --package-path Experiments/StructuralContext/StateOperations/Prototype --scratch-path .build/state-operations
          SEKKA_STATE_BIN="$(swift build --package-path Experiments/StructuralContext/StateOperations/Prototype --scratch-path .build/state-operations --show-bin-path)"
          python3 Experiments/StructuralContext/StateOperations/Prototype/controls.py --binary "$SEKKA_STATE_BIN/state-probe" --output .build/pr-review/state-operations.json --text-output .build/pr-review/state-operations.text
      - name: Exercise review boundaries
        run: python3 Scripts/review_probes.py --output .build/pr-review/probes.json
      - name: Dependency relay prototype controls
        run: |
          swift build --package-path Experiments/DependencyRelay --scratch-path .build/dependency-relay-ci
          SEKKA_RELAY_BIN="$(swift build --package-path Experiments/DependencyRelay --scratch-path .build/dependency-relay-ci --show-bin-path)"
          python3 Experiments/DependencyRelay/check_callback.py "$SEKKA_RELAY_BIN/callback-probe" --output .build/pr-review/callback-relay.json --text-output .build/pr-review/callback-relay.text
          python3 Experiments/DependencyRelay/check_contract.py "$SEKKA_RELAY_BIN/contract-probe" --output .build/pr-review/callback-contract.json --text-output .build/pr-review/callback-contract.text
          python3 Experiments/DependencyRelay/check.py "$SEKKA_RELAY_BIN/relay-probe"
          "$SEKKA_RELAY_BIN/relay-probe" Experiments/DependencyRelay/Fixtures/before.swift Experiments/DependencyRelay/Fixtures/after.swift > .build/pr-review/dependency-relay.json
          "$SEKKA_RELAY_BIN/relay-probe" Experiments/DependencyRelay/Fixtures/before.swift Experiments/DependencyRelay/Fixtures/after.swift --text > .build/pr-review/dependency-relay.text
      - name: Exercise structural review questions
        run: python3 Scripts/review_probes.py --cases Fixtures/design-review/cases.json --output .build/pr-review/design-review.json
      - name: Upload review material
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sekka-review-${{ github.event.pull_request.number || 'manual' }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: |
            .build/pr-review/state-operations.json
            .build/pr-review/state-operations.text
            .build/pr-review/callback-contract.json
            .build/pr-review/callback-contract.text
            .build/pr-review/callback-relay.json
            .build/pr-review/callback-relay.text
            .build/pr-review/dependency-relay.json
            .build/pr-review/dependency-relay.text
            .build/pr-review/structural-context.json
            .build/pr-review/structural-context.text
            .build/pr-review/manifest.json
            .build/pr-review/candidate.text
            .build/pr-review/candidate.compact
            .build/pr-review/candidate.full
            .build/pr-review/ordinary.diff
            .build/pr-review/summary.md
            .build/pr-review/probes.json
            .build/pr-review/design-review.json
